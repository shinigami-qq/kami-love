<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>сообщение для макса</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
      font-family: Arial, sans-serif;
    }

    .box {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      font-size: 22px;
      text-align: center;
      animation: appear 1s ease;
    }

    @keyframes appear {
      from {
        transform: scale(0.7);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    оближи мне пятки пожалуйста, макс<br>
    ты мне нравишься
  </div>
</body>
</html>
