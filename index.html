<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>kami & max</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* типа картинка */
    .image-box {
      position: relative;
      padding: 40px 50px;
      background: #111;
      border-radius: 25px;
      box-shadow: 0 0 40px rgba(255,255,255,0.05);
      color: #e6e6e6;
      font-size: 22px;
      text-align: center;
      z-index: 2;
      animation: appear 1s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    /* сердечки */
    .heart {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #2b2b2b;
      transform: rotate(45deg);
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      background: #2b2b2b;
      border-radius: 50%;
    }

    .heart::before {
      top: -8px;
      left: 0;
    }

    .heart::after {
      left: -8px;
      top: 0;
    }

    @keyframes float {
      0% {
        bottom: -10%;
        opacity: 0;
      }
      30% {
        opacity: 0.8;
      }
      100% {
        bottom: 110%;
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="image-box">
    макс — любитель лизать пяточки ками 🖤
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 4 + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
